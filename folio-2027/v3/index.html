function calendar(es){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();return `<div class="card"><div class="cardhead"><h2>${month.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h2><div class="rowline"><button class="btn small" data-act="month-prev">‹</button><button class="btn small" data-act="month-today">Today</button><button class="btn small" data-act="month-next">›</button></div></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="calhead">${d}</div>`).join('')}${Array.from({length:first},()=>'<div class="calday blank"></div>').join('')}${Array.from({length:last},(_,i)=>{const dt=ymd(new Date(y,m,i+1)),items=es.filter(e=>e.date===dt);return `<div class="calday ${dt===ymd(today())?'today':''}"><b>${i+1}</b>${items.slice(0,3).map(e=>`<button data-school="${e.school}" data-tab="deadlines" title="${E(e.title)}">${E(sch(e.school).short+' · '+e.title)}</button>`).join('')}${items.length>3?`<button data-day="${dt}">+${items.length-3} more</button>`:''}</div>`}).join('')}</div></div>`}
function essayCard(s,e){const wc=wordCount(e.draft),over=e.limit!=null&&wc>e.limit;return `<article class="card essaycard"><div class="essaytitle"><div><div class="eyebrow">${E(s.short)} · ${E(e.verified||'User-entered')}</div><h3>${E(e.title)}</h3></div><select data-essay-status="${E(s.id)}:${E(e.id)}" aria-label="Essay status">${['Verify','Not started','Drafting','Review','Final','Not required'].map(v=>`<option ${e.status===v?'selected':''}>${v}</option>`).join('')}</select></div><p class="sub">${E(e.prompt)}</p><div class="quicklinks" style="margin:9px 0">${link(e.source||s.essaySource,'Prompt source') }<button class="btn small" data-edit-essay="${E(s.id)}:${E(e.id)}">Edit prompt / limit</button></div><textarea data-draft="${E(s.id)}:${E(e.id)}" placeholder="Write or paste your own draft here…" aria-label="${E(e.title)} draft">${E(e.draft)}</textarea><div class="essaymeta"><span class="sub essaycount ${over?'over':''}" data-count="${E(s.id)}:${E(e.id)}">${wc}${e.limit!=null?' / '+e.limit:''} words${over?' · Over limit':''}</span><div class="rowline"><button class="btn small" data-copy-essay="${E(s.id)}:${E(e.id)}">${icon('copy')} Copy</button><button class="btn small" data-review-essay="${E(s.id)}:${E(e.id)}">${icon('spark')} Review</button></div></div></article>`}
function writing(){let list=state.schools.filter(s=>essayFilter==='All'||s.id===essayFilter).filter(s=>s.essays.length);return heading('Writing studio','Your drafts, word limits, and source-linked prompt library.',`<button class="btn primary" data-act="add-essay">${icon('plus')} Add prompt</button>`)+`<div class="card" style="margin-bottom:18px"><div class="cardhead"><h2>Common personal statement</h2><span class="sub" id="personalCount">${wordCount(state.profile.statement||'')} words</span></div><textarea id="personalEssay" placeholder="Paste the personal statement you have already written…" style="min-height:160px">${E(state.profile.statement)}</textarea><div class="quicklinks"><button class="btn small" data-act="review-personal">${icon('spark')} Review my statement</button><button class="btn small" data-act="copy-personal">${icon('copy')} Copy</button></div></div><div class="toolbar"><select id="essayFilter" aria-label="Filter writing by school"><option value="All">All schools</option>${state.schools.map(s=>`<option value="${E(s.id)}" ${essayFilter===s.id?'selected':''}>${E(s.name)}</option>`).join('')}</select><span class="sub">UC applicants choose four of eight PIQs. Other prompts may be optional or not required; verify each.</span></div>${list.map(s=>`<div class="cardhead sectiongap"><h2>${E(s.name)}</h2><button class="btn small ghost" data-school="${E(s.id)}" data-tab="essays">School view ${icon('arrow')}</button></div>${s.essays.map(e=>essayCard(s,e)).join('')}`).join('')||'<div class="empty">No entries.</div>'}`}
function packetText(s){return ['APPLICATION PREPARATION PACKET — REVIEW BEFORE SUBMISSION',`School: ${s.name}`,`Round: ${s.round}`,`Intended major: ${s.major}`,`Testing strategy: ${s.test}`,`Deadline: ${s.deadline||'verify official portal'}`,`Source: ${s.source}`,'','PROFILE',...Object.entries(state.profile).filter(([k])=>k!=='statement').map(([k,v])=>`${k}: ${v}`),'','PERSONAL STATEMENT',state.profile.statement||'[not entered]','','SCHOOL ESSAYS',...s.essays.filter(e=>e.status!=='Not required').map(e=>`${e.title} (${e.status}; ${wordCount(e.draft)} words)\n${e.prompt}\n${e.draft||'[not entered]'}`),'','CHECKLIST',...checkItems.map(([k,l])=>`${s.checks?.[k]?'[x]':'[ ]'} ${l}`),'','Never submit without my approval. Verify facts, dates, and portal fields. Do not invent details.'].join('\n')}
function packet(s){return `<div class="split"><div class="card"><h2>Application packet</h2><p class="sub" style="margin:8px 0">Review and copy verified fields into the official application. This app does not log in to or submit forms on your behalf.</p><div class="checkrow"><div class="tasktext"><b>Intended major</b><div>${E(s.major)}</div></div><button class="btn small" data-copy-text="${E(s.major)}">Copy</button></div><div class="checkrow"><div class="tasktext"><b>Testing decision</b><div>${E(s.test)} · ${E(state.profile.sat)}</div></div><button class="btn small" data-copy-text="${E(state.profile.sat)}">Copy SAT</button></div><div class="checkrow"><div class="tasktext"><b>Personal statement</b><div class="sub">${wordCount(state.profile.statement||'')} words</div></div><button class="btn small" data-act="copy-personal">Copy</button></div><div class="checkrow"><div class="tasktext"><b>Activities bank</b><div class="sub">Edit in Profile</div></div><button class="btn small" data-copy-text="${E(state.profile.activities)}">Copy</button></div><div class="quicklinks">${link(s.platform==='UC application'?'https://apply.universityofcalifornia.edu/':'https://apply.commonapp.org/','Open application','btn primary')}${link(s.source,'Official requirements')}<button class="btn" data-act="copy-packet">${icon('copy')} Copy full packet</button><button class="btn" data-act="agent-packet">${icon('spark')} Prepare agent instructions</button></div></div><div class="card"><h2>Readiness review</h2><p class="sub" style="margin:8px 0">Mark each relevant item only after verifying it. This is not a portal sync.</p>${checkItems.map(([k,l,d])=>`<div class="checkrow"><input type="checkbox" id="p-${k}" data-check="${k}" ${s.checks?.[k]?'checked':''}><label for="p-${k}">${E(l)}</label></div>`).join('')}</div></div><div class="card"><div class="cardhead"><h2>Update actual application status</h2><select id="quickStatus">${['Considering','Verify submission','Submitted','Deferred','Waitlisted','Accepted','Rejected','Withdrawn'].map(v=>`<option ${s.status===v?'selected':''}>${v}</option>`).join('')}</select></div><p class="sub">Forecasts and confirmed outcomes are distinct. Change status only based on your actual application or admissions decision.</p></div>`}
function profile(){return heading('Applicant profile','Your reusable source of truth. Edit any detail as it changes.',`<button class="btn primary" data-act="copy-profile">${icon('copy')} Copy profile</button>`)+`<div class="card"><div class="formgrid">${[['name','Display name'],['school','High school'],['entry','Entry term'],['sat','SAT / ACT'],['gpa','GPA'],['rank','Class rank'],['major','Academic interests'],['rigor','Course rigor']].map(([k,l])=>`<div class="field"><label for="pr-${k}">${l}</label><input id="pr-${k}" type="text" data-profile="${k}" value="${E(state.profile[k])}"></div>`).join('')}<div class="field full"><label for="pr-activities">Activities, honors and evidence bank</label><textarea id="pr-activities" data-profile="activities" style="min-height:180px">${E(state.profile.activities)}</textarea></div><div class="field full"><label for="pr-notes">Additional information and verification notes</label><textarea id="pr-notes" data-profile="notes">${E(state.profile.notes)}</textarea></div>${[['honors','Honors and awards'],['exams','AP / testing record'],['courses','Transcript and course history'],['additional','Additional information'],['sources','Private source documents and portal links']].map(([k,l])=>`<div class="field full"><label for="pr-${k}">${l}</label><textarea id="pr-${k}" data-profile="${k}" style="min-height:150px">${E(state.profile[k]||'')}</textarea></div>`).join('')}</div><div class="notice">Your application data is encrypted in this browser. An encrypted cloud backup supports account access on other devices when connected. Keep your recovery link private, and sign out on shared devices. Avoid entering passwords, Social Security numbers, or confidential recommendation letters. Export backups regularly.</div></div>`}
function ai(){return heading('AI workspace','Make plans, audit your application, and prepare agent-ready instructions.')+`<div class="split"><div class="card"><div class="cardhead"><h2>Assistant</h2><span class="pill ${aiAvailable?'green':''}">${aiAvailable?'Private API configured':'ChatGPT handoff available'}</span></div><div class="field"><label for="aiSchool">School context</label><select id="aiSchool"><option value="">Entire portfolio</option>${state.schools.map(s=>`<option value="${E(s.id)}" ${aiSchool===s.id?'selected':''}>${E(s.name)}</option>`).join('')}</select></div><div class="field"><label for="aiMode">Task</label><select id="aiMode">${['Review essay','Plan my week','Audit deadlines','Assess application strategy','Prepare application packet','Other'].map(v=>`<option ${aiMode===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="aiRequest">Instructions or draft</label><textarea id="aiRequest" placeholder="What should the assistant help with?">${E(aiRequest)}</textarea></div><div class="toolbar"><button class="btn primary" data-act="ai-handoff">${icon('spark')} Open assistant with context</button><button class="btn" data-act="ai-copy">${icon('copy')} Copy contextual prompt</button><a class="btn" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Open ChatGPT ${icon('external')}</a></div><div class="notice">The real ChatGPT handoff copies your selected context and opens ChatGPT. Paste the prompt to start the task. No fake AI answers, private API key or automatic portal login. Check each applicant-owned response and submission.</div></div><div class="card"><h2>Response / workbench</h2><p class="sub" style="margin:8px 0">A response from the private API will appear here. You can also paste feedback manually.</p><textarea id="aiOutput" style="min-height:280px" placeholder="Assistant feedback or research notes…">${E(aiOutput||state.aiNotes||'')}</textarea><div class="toolbar" style="margin-top:9px"><button class="btn small" data-act="copy-ai-output">${icon('copy')} Copy</button></div></div></div><div class="card"><div class="cardhead"><h2>Priority planner</h2><span class="pill">Deterministic · no AI required</span></div><p class="sub">Allocate available study time among your upcoming dated tasks. The plan is an editable recommendation, not an automatic scheduling commitment.</p><div class="formgrid sectiongap"><div class="field"><label for="availableMinutes">Available minutes today</label><input id="availableMinutes" type="number" min="15" max="720" value="120"></div><div class="field"><label for="plannerWindow">Look ahead</label><select id="plannerWindow"><option value="7">7 days</option><option value="14" selected>14 days</option><option value="30">30 days</option></select></div></div><button class="btn primary" data-act="plan">Generate plan</button><div id="planResult" style="margin-top:15px"></div></div>`}
function aiPrompt(){const s=sch(aiSchool);const context=s?packetText(s):['Portfolio:',...state.schools.map(s=>`${s.name}: ${s.status}; ${s.round}; odds ${percent(s.odds)}; deadline ${s.deadline||'verify'}; ${s.major}`),'Upcoming dates:',...upcoming().slice(0,30).map(e=>`${e.date} ${sch(e.school).short}: ${e.title}${e.conditional?' (conditional)':''} — ${e.source}`),'Profile:',...Object.entries(state.profile).filter(([k])=>k!=='statement').map(([k,v])=>`${k}: ${v}`)].join('\n');return `You are my college application assistant. Task: ${aiMode}.\n${aiRequest}\n\n${context}\n\nUse only supplied facts or clearly cite reliable current sources. Distinguish estimates from facts. Do not invent achievements, deadlines, odds or confidence intervals. Preserve my voice; give feedback and practical steps rather than fabricating personal experiences. Do not submit applications or change external accounts without my explicit review. Mark unverified information clearly.`}
function settings(){return heading('Settings','Manage privacy, reminders and your local workspace.')+`<div class="split"><div class="card"><h2>Appearance and preferences</h2><div class="switchline"><div><b>Theme</b><div class="sub">Light or dark mode</div></div><select id="theme"><option value="light" ${state.settings.theme==='light'?'selected':''}>Light</option><option value="dark" ${state.settings.theme==='dark'?'selected':''}>Dark</option></select></div><div class="switchline"><div><b>School logo icons</b><div class="sub">Load favicons from an external icon service (school domains only).</div></div><input type="checkbox" id="logoSetting" ${state.settings.logos?'checked':''}></div><div class="switchline"><div><b>Financial aid deadlines</b><div class="sub">Include applicable aid tasks in upcoming lists.</div></div><input type="checkbox" id="aidSetting" ${state.settings.aid?'checked':''}></div><div class="switchline"><div><b>Optional / conditional tasks</b><div class="sub">Show scholarships, interviews and other conditional tasks.</div></div><input type="checkbox" id="optionalSetting" ${state.settings.optional?'checked':''}></div></div><div class="card"><h2>Phone reminders</h2><p class="sub" style="margin-top:8px">Choose your reminder dates below. Native Folio push is configured in the App notifications card. Calendar export is a backup option.</p><div class="divider"></div><div class="field"><label>Alert offsets before each due date</label><div class="toolbar">${[14,7,3,1,0].map(d=>`<label class="chip"><input type="checkbox" data-reminder="${d}" ${state.settings.reminders.includes(d)?'checked':''}>${d===0?'Due day':d+'d'}</label>`).join('')}</div></div><div class="toolbar"><button class="btn primary" data-act="export-calendar">${icon('download')} Export .ics</button><button class="btn" data-act="test-push">${icon('bell')} Send app test</button></div><div class="notice">App push is delivered separately from calendar alerts. Enable Folio notifications on each device. Calendar imports may use their own alarm settings.</div></div></div><div class="card"><h2>Data and backup</h2><p class="sub" style="margin-top:8px">${storageOK?'Autosave available in this browser.':'Storage is unavailable; keep the app open and export your data.'} Backups contain your private drafts and profile. Store them securely.</p><div class="toolbar sectiongap"><button class="btn primary" data-act="export-json">${icon('download')} Export backup</button><button class="btn" data-act="import-json">Import backup</button><button class="btn" data-act="export-csv">Export odds CSV</button><button class="btn danger" data-act="reset">Reset workspace</button></div><div class="divider"></div><h3>Source policy</h3><p class="sub">The initial odds are the final audited estimates from your conversation, not official rates. Source-linked dates were checked November 24, 2026 where available. Conflicting, historical, or unconfirmed items require manual verification. No confidence interval is invented. School application status is not synchronized with admissions portals.</p></div>`}
function render(){shell();let html=page==='overview'?overview():page==='forecast'?forecast():page==='schools'?schoolList():page==='school'?detail():page==='deadlines'?deadlines():page==='essays'?writing():page==='ai'?aiView():page==='profile'?profile():settings()+serviceSettings();$('#app').innerHTML=html;document.title='Folio | '+(page==='school'?sch(selected)?.short:(page==='forecast'?'Forecast lab':nav.find(n=>n[0]===page)?.[2])||'Admissions studio');if(page==='school'&&tab==='overview'&&$('#campusPhoto'))loadPhoto();$all('img[data-fallback]').forEach(img=>img.addEventListener('error',()=>{img.parentNode.textContent=img.dataset.fallback}));}

function editSchool(s=null){const x=s||{id:uid(),name:'',short:'',location:'',domain:'',color:'#24543e',odds:null,history:[],round:'RD',status:'Considering',major:'',test:'Verify',deadline:'',source:'',decision:'',verified:'User-entered / verify',platform:'Common App / official portal',note:'',checks:{},essays:[],range:null};showDialog(`<h2>${s?'Edit school':'Add school'}</h2><form id="schoolForm"><div class="formgrid">${[['name','School name'],['short','Short name'],['location','City / state'],['domain','University domain'],['round','Application round'],['major','Intended major'],['test','Testing strategy'],['decision','Decision window'],['platform','Application platform']].map(([k,l])=>`<div class="field"><label for="sf-${k}">${l}</label><input id="sf-${k}" name="${k}" value="${E(x[k])}" ${k==='name'?'required':''}></div>`).join('')}<div class="field"><label>Status</label><select name="status">${['Considering','Verify submission','Submitted','Deferred','Waitlisted','Accepted','Rejected','Withdrawn'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Baseline acceptance estimate (%)</label><input name="odds" type="number" min="0" max="100" step="0.1" value="${x.odds??''}"></div><div class="field"><label>School odds multiplier (0.1–10)</label><input name="factor" type="number" min="0.1" max="10" step="0.1" value="${x.factor||1}"></div><div class="field full"><label>Evidence / rationale</label><textarea name="factorReason" placeholder="Source, round, applicant fit, reason for adjustment">${E(x.factorReason||'')}</textarea></div><div class="field"><label>Application deadline</label><input name="deadline" type="date" value="${E(x.deadline)}"></div><div class="field full"><label>Official source URL</label><input name="source" type="text" value="${E(x.source)}"></div><div class="field"><label>Scenario low (%)</label><input name="low" type="number" min="0" max="100" step="0.1" value="${x.range?.[0]??''}"></div><div class="field"><label>Scenario high (%)</label><input name="high" type="number" min="0" max="100" step="0.1" value="${x.range?.[1]??''}"></div></div><div class="notice" style="margin-bottom:15px">Scenario bounds are personal planning assumptions, not confidence intervals. Leave blank if unknown.</div><div class="toolbar">${s?'<button type="button" class="btn danger" id="deleteSchool">Remove / archive school</button>':''}<button class="btn primary" type="submit">Save school</button></div></form>`);$('#schoolForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),lo=f.low===''?null:Number(f.low),hi=f.high===''?null:Number(f.high);if((lo===null)!==(hi===null)||lo!==null&&lo>hi){toast('Enter both scenario bounds, with low ≤ high.');return}const newOdds=f.odds===''?null:Number(f.odds),previous=x.odds;if(f.deadline!==x.deadline||f.source!==x.source)x.verified='User-entered / verify';delete f.low;delete f.high;Object.assign(x,f,{odds:newOdds,factor:f.factor===''?1:Number(f.factor),range:lo===null?null:[lo,hi]});if(newOdds!==null&&newOdds!==previous)x.history.push(newOdds);if(!s){if(state.schools.some(a=>a.name.trim().toLowerCase()===x.name.trim().toLowerCase())){toast('That school is already in the portfolio.');return}x.short=x.short||x.name.slice(0,8);state.schools.push(x)}save();closeDialog();openSchool(x.id);toast('School saved')};if(s)$('#deleteSchool').onclick=()=>archiveSchool(s)}
function eventForm(e=null){if(!state.schools.length){toast('Add a school first.');return}const x=e||{id:uid(),school:selected||state.schools[0].id,title:'',date:'',kind:'Custom',source:'',note:'',conditional:false,done:false,verified:false};showDialog(`<h2>${e?'Edit deadline':'Add deadline'}</h2><form id="eventForm"><div class="field"><label>School</label><select name="school">${state.schools.map(s=>`<option value="${E(s.id)}" ${s.id===x.school?'selected':''}>${E(s.name)}</option>`).join('')}</select></div><div class="field"><label>Task / deadline title</label><input name="title" value="${E(x.title)}" required></div><div class="formgrid"><div class="field"><label>Date</label><input name="date" type="date" value="${E(x.date)}" required></div><div class="field"><label>Category</label><select name="kind">${['Custom','Application','Decision','Scholarship','Financial aid','Materials','Interview','Conditional'].map(v=>`<option ${v===x.kind?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label>Source link (optional)</label><input name="source" value="${E(x.source)}"></div><div class="field"><label>Notes</label><textarea name="note">${E(x.note)}</textarea></div><label class="chip"><input type="checkbox" name="conditional" ${x.conditional?'checked':''}> Optional or conditional</label> <label class="chip"><input type="checkbox" name="verified" ${x.verified?'checked':''}> Source verified</label><div class="toolbar sectiongap">${e?'<button class="btn danger" type="button" id="deleteEvent">Delete</button>':''}<button class="btn primary" type="submit">Save deadline</button></div></form>`);$('#eventForm').onsubmit=ev=>{ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target));Object.assign(x,f,{conditional:!!f.conditional,verified:!!f.verified});if(!e)state.events.push(x);save();closeDialog();render();toast('Deadline saved')};if(e)$('#deleteEvent').onclick=()=>{state.events=state.events.filter(a=>a.id!==e.id);save();closeDialog();render();toast('Deadline deleted')}}
function essayForm(s=null,e=null){if(!state.schools.length){toast('Add a school first.');return}const x=e||{id:uid(),title:'',prompt:'',limit:null,draft:'',status:'Not started',source:'',verified:'User-entered / verify'};showDialog(`<h2>${e?'Edit prompt':'Add writing prompt'}</h2><form id="essayForm"><div class="field"><label>School</label><select name="school" ${e?'disabled':''}>${state.schools.map(a=>`<option value="${E(a.id)}" ${a.id===(s?.id||selected||essayFilter)?'selected':''}>${E(a.name)}</option>`).join('')}</select></div><div class="field"><label>Prompt title</label><input name="title" value="${E(x.title)}" required></div><div class="field"><label>Exact prompt or summary</label><textarea name="prompt">${E(x.prompt)}</textarea></div><div class="field"><label>Word limit (blank if unknown)</label><input name="limit" type="number" min="1" max="10000" value="${x.limit??''}"></div><div class="field"><label>Official source URL</label><input name="source" value="${E(x.source)}"></div><div class="field"><label>Verification note</label><input name="verified" value="${E(x.verified)}"></div><div class="toolbar">${e?'<button class="btn danger" type="button" id="deleteEssay">Delete prompt</button>':''}<button class="btn primary" type="submit">Save prompt</button></div></form>`);$('#essayForm').onsubmit=ev=>{ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target));let school=s||sch(f.school);delete f.school;Object.assign(x,f,{limit:f.limit===''?null:Number(f.limit)});if(!e)school.essays.push(x);save();closeDialog();render();toast('Prompt saved')};if(e)$('#deleteEssay').onclick=()=>{if(!confirm('Delete this prompt and draft?'))return;s.essays=s.essays.filter(a=>a.id!==e.id);save();closeDialog();render();toast('Prompt deleted')}}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copied to clipboard')}catch{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();try{if(document.execCommand('copy'))toast('Copied to clipboard');else throw Error()}catch{showDialog(`<h2>Copy this text</h2><textarea readonly style="min-height:240px">${E(text)}</textarea>`)}finally{t.remove()}}}
function download(name,content,type){const b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Export created')}
function icalEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function icalFold(s){const bytes=new TextEncoder();let out=[],cur='';for(const ch of s){if(bytes.encode(cur+ch).length>73){out.push(cur);cur=' '+ch}else cur+=ch}out.push(cur);return out.join('\r\n')}
function makeIcs(){const stamp=new Date().toISOString().replace(/[-:]|\.\d{3}/g,'');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Folio//Admissions Studio//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Folio Admissions'];for(const e of upcoming()){const s=sch(e.school),dt=e.date.replaceAll('-','');const end=dateObj(e.date);end.setDate(end.getDate()+1);lines.push('BEGIN:VEVENT',`UID:${e.id}-folio-2027@local`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${dt}`,`DTEND;VALUE=DATE:${ymd(end).replaceAll('-','')}`,`SUMMARY:${icalEscape(s.short+' — '+e.title+(e.conditional?' (conditional)':''))}`,`DESCRIPTION:${icalEscape((e.note||'')+'\nSource: '+(e.source||'Verify in portal')+'\nSource status: '+(e.verified?'checked':'verify'))}`);for(const d of state.settings.reminders){lines.push('BEGIN:VALARM',`TRIGGER:${Number(d)===0?'PT0M':'-P'+Number(d)+'D'}`,'ACTION:DISPLAY',`DESCRIPTION:${icalEscape(s.short+' '+e.title)}`,'END:VALARM')}lines.push('END:VEVENT')}lines.push('END:VCALENDAR');return lines.map(icalFold).join('\r\n')+'\r\n'}
function csv(){const c=v=>'"'+String(v??'').replaceAll('"','""')+'"';return [['School','Status','Round','Baseline estimate (%)','Scenario estimate (%)','Deadline','Major','Testing','Source','Prior estimates','Scenario low','Scenario high'],...state.schools.map(s=>[s.name,s.status,s.round,s.odds,effectiveOdds(s),s.deadline,s.major,s.test,s.source,s.history.join(' / '),s.range?.[0],s.range?.[1]])].map(r=>r.map(c).join(',')).join('\r\n')}
function findEssay(key){const [sid,eid]=key.split(':');const s=sch(sid);return [s,s?.essays.find(e=>e.id===eid)]}
async function loadPhoto(){const s=sch(selected),box=$('#campusPhoto');if(!box)return;box.innerHTML='<p class="sub loader">Searching Wikimedia Commons…</p>';try{const api='https://commons.wikimedia.org/w/api.php?'+new URLSearchParams({action:'query',generator:'search',gsrsearch:s.name+' campus building filetype:bitmap',gsrnamespace:'6',gsrlimit:'5',prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'800',format:'json',origin:'*'});const resp=await fetch(api);if(!resp.ok)throw Error();const data=await resp.json();const items=Object.values(data.query?.pages||{}).filter(p=>p.imageinfo?.[0]?.thumburl);if(!items.length)throw Error();const p=items[0],i=p.imageinfo[0],attr=i.extmetadata?.Artist?.value||'',lic=i.extmetadata?.LicenseShortName?.value||'See file page';if(!$('#campusPhoto')||selected!==s.id)return;box.innerHTML=`<img class="campusphoto" src="${E(url(i.thumburl))}" alt="Wikimedia Commons search result for ${E(s.name)}" loading="lazy"><p class="sub">Commons search result — verify the campus identification. ${E(p.title.replace('File:',''))} · ${E(lic.replace(/<[^>]+>/g,''))} · ${E(attr.replace(/<[^>]+>/g,'').slice(0,100))}</p>${link(i.descriptionurl||'https://commons.wikimedia.org/wiki/'+encodeURIComponent(p.title),'Photo details / attribution')}`}catch{box.innerHTML=`<p class="sub">Photo retrieval unavailable. ${link('https://commons.wikimedia.org/w/index.php?search='+encodeURIComponent(s.name+' campus')+'&title=Special:MediaSearch&type=image','Browse campus photos')}</p>`}}
async function runAI(){if(!aiAvailable||aiBusy)return;aiBusy=true;render();try{const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:aiPrompt()})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');aiOutput=j.text;state.aiNotes=aiOutput;save();toast('Assistant response received')}catch(e){aiOutput='AI request failed: '+e.message;toast('AI request failed')}finally{aiBusy=false;render()}}
function plan(){let mins=Math.floor(Number($('#availableMinutes').value)),win=Number($('#plannerWindow').value);if(!Number.isFinite(mins)||mins<15||mins>720){toast('Enter 15–720 minutes.');return}let pool=upcoming().filter(e=>days(e.date)<=win);if(!pool.length){$('#planResult').innerHTML='<p class="sub">No upcoming tasks in the selected window.</p>';return}pool.sort((a,b)=>days(a.date)-days(b.date)||Number(a.conditional)-Number(b.conditional));const n=Math.min(pool.length,Math.floor(mins/15),4),base=Math.floor(mins/n),remainder=mins-base*n;let html='<div class="notice">Suggested work blocks, ordered by due date; verify conditional items before spending time on them.</div>';for(let i=0;i<n;i++){const e=pool[i];html+=`<div class="task"><span class="pill">${base+(i<remainder?1:0)} min</span><div class="tasktext"><b>${E(sch(e.school).short+' · '+e.title)}</b><div class="sub">Due ${E(fmtShort(e.date))}${e.conditional?' · Conditional':''}</div></div><button class="btn small" data-school="${E(e.school)}" data-tab="deadlines">${icon('arrow')}</button></div>`}$('#planResult').innerHTML=html}
function act(a){switch(a){case'archive-list':archiveDialog();break;case'archive-school':if(selected)archiveSchool(sch(selected));break;case'apply-global':{const v=Number($('#globalFactor').value);if(!Number.isFinite(v)||v<.1||v>10){toast('Enter a multiplier between 0.1 and 10.');break}state.model.global=v;save();render();break}case'apply-threshold':{const v=Number($('#modelThreshold').value),n=forecastSummary().p.length;if(!Number.isInteger(v)||v<1||v>Math.max(1,n)){toast('Enter a valid target.');break}state.model.threshold=v;save();render();break}case'reset-model':if(confirm('Reset multipliers to 1? Baselines stay unchanged.')){state.model.global=1;state.schools.forEach(s=>{s.factor=1;s.factorReason=''});save();render()}break;case'ai-odds':aiMode='Audit odds';aiRequest='';go('ai');break;case'ai-run-real':runIntegratedAI();break;case'sync-now':cloudReady?flushCloud():initCloud();break;case'cloud-load':resolveCloud('load');break;case'cloud-keep':resolveCloud('keep');break;case'enable-push':enablePush();break;case'test-push':testPush();break;case'disable-push':disablePush();break;case'lock-device':if(confirm('Sign out of this device? You will need your recovery link to reopen it.')){deviceKey('clear').then(()=>{history.replaceState(null,'',location.pathname);location.reload()}).catch(()=>toast('Could not clear remembered device key.'));}break;case'ai-handoff':window.open('https://chatgpt.com/','_blank','noopener,noreferrer');copy(aiPrompt());break;case'export-calendar':download('folio-admissions-reminders.ics',makeIcs(),'text/calendar');break;case'export-json':download('folio-backup-'+ymd(today())+'.json',JSON.stringify(state,null,2),'application/json');break;case'export-csv':download('folio-odds.csv',csv(),'text/csv');break;case'import-json':$('#importFile').click();break;case'reset':if(confirm('Reset all school edits, tasks, profile and drafts to the initial data? Export a backup first.')){state=clone(SEED);save();go('overview');toast('Workspace reset')}break;case'add-school':editSchool();break;case'edit-school':editSchool(sch(selected));break;case'add-event':eventForm();break;case'add-essay':essayForm(page==='school'?sch(selected):null);break;case'close-dialog':closeDialog();break;case'toggle-view':viewMode=viewMode==='table'?'cards':'table';render();break;case'calendar-toggle':deadlineView=deadlineView==='list'?'calendar':'list';render();break;case'month-prev':month=new Date(month.getFullYear(),month.getMonth()-1,1);render();break;case'month-next':month=new Date(month.getFullYear(),month.getMonth()+1,1);render();break;case'month-today':month=new Date();render();break;case'copy-profile':copy(Object.entries(state.profile).map(([k,v])=>`${k}: ${v}`).join('\n'));break;case'copy-personal':copy(state.profile.statement||'');break;case'review-personal':aiSchool='';aiMode='Review essay';aiRequest='Review my personal statement for clarity, distinctiveness, authenticity, structure, and concrete improvements. Preserve my voice.\n\n'+(state.profile.statement||'[paste draft]');go('ai');break;case'copy-packet':copy(packetText(sch(selected)));break;case'agent-packet':aiSchool=selected;aiMode='Prepare application';aiRequest='Prepare a field-by-field mapping for the official application, identify missing required information, and draft a safe checklist. Do not log in, change any external account, or submit anything without my review.';go('ai');break;case'ai-copy':copy(aiPrompt());break;case'ai-run':runAI();break;case'copy-ai-output':copy(aiOutput||state.aiNotes||'');break;case'plan':plan();break;case'photo':loadPhoto();break;case'test-notification':(async()=>{if(!('Notification'in window)||!window.isSecureContext){toast('Browser notifications need a supported secure origin. Use calendar export.');return}try{let p=Notification.permission;if(p==='default')p=await Notification.requestPermission();if(p!=='granted'){toast('Notification permission not granted.');return}const reg=await navigator.serviceWorker?.getRegistration();if(reg)await reg.showNotification('Folio reminder test',{body:'Your admissions reminder is working on this device.'});else new Notification('Folio reminder test',{body:'Your admissions reminder is working on this device.'});toast('Test notification requested')}catch{toast('This device could not display the notification. Use calendar export.')}})();break}}
document.addEventListener('click',e=>{const restore=e.target.closest('[data-restore-school]'),edit=e.target.closest('[data-model-edit]'),am=e.target.closest('[data-ai-mode]');if(am){aiMode=am.dataset.aiMode;render();return}if(restore){restoreSchool(Number(restore.dataset.restoreSchool));return}if(edit){editSchool(sch(edit.dataset.modelEdit));return}const t=e.target.closest('[data-act],[data-go],[data-school],[data-tab-change],[data-edit-event],[data-edit-essay],[data-copy-essay],[data-review-essay],[data-copy-text],[data-day]');if(!t||e.target.closest('a')&&!t.matches('a'))return;const d=t.dataset;if(d.act){act(d.act);return}if(d.go){go(d.go);return}if(d.school){openSchool(d.school,d.tab||'overview');return}if(d.tabChange){tab=d.tabChange;render();return}if(d.editEvent){const ev=state.events.find(x=>x.id===d.editEvent);if(ev)eventForm(ev);return}if(d.editEssay){const [s,a]=findEssay(d.editEssay);if(a)essayForm(s,a);return}if(d.copyEssay){const [,a]=findEssay(d.copyEssay);if(a)copy(a.draft);return}if(d.reviewEssay){const [s,a]=findEssay(d.reviewEssay);if(a){aiSchool=s.id;aiMode='Review essay';aiRequest=`Review my draft for the following prompt: ${a.prompt}\nLimit: ${a.limit||'verify'}\nDraft:\n${a.draft||'[paste draft]'}\nGive specific feedback without inventing experiences.`;go('ai')}return}if(d.copyText!==undefined){copy(d.copyText);return}if(d.day){showDialog(`<h2>${E(fmt(d.day))}</h2>${events().filter(x=>x.date===d.day).map(eventRow).join('')}`)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('article[data-school]')){e.preventDefault();openSchool(e.target.dataset.school)}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(t.id==='schoolSearch'){query=t.value;const temp=document.createElement('div');temp.innerHTML=schoolList();$('#schoolResults').innerHTML=temp.querySelector('#schoolResults').innerHTML;$all('img[data-fallback]').forEach(i=>i.onerror=()=>{i.parentNode.textContent=i.dataset.fallback});return}if(d.profile){state.profile[d.profile]=t.value;save()}if(d.draft){const [,a]=findEssay(d.draft);if(a){a.draft=t.value;if(a.status==='Not started'&&a.draft.trim()){a.status='Drafting';const sel=$all('[data-essay-status]').find(x=>x.dataset.essayStatus===d.draft);if(sel)sel.value='Drafting'}save();const count=$all('[data-count]').find(x=>x.dataset.count===d.draft),wc=wordCount(a.draft);if(count){count.textContent=wc+(a.limit!=null?' / '+a.limit:'')+' words'+(a.limit!=null&&wc>a.limit?' · Over limit':'');count.classList.toggle('over',a.limit!=null&&wc>a.limit)}}}if(t.id==='personalEssay'){state.profile.statement=t.value;save();$('#personalCount').textContent=wordCount(t.value)+' words'}if(t.id==='schoolNote'&&selected){sch(selected).note=t.value;save()}if(t.id==='aiRequest')aiRequest=t.value;if(t.id==='aiOutput'){aiOutput=t.value;state.aiNotes=t.value;save()}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(d.modelFactor){const s=sch(d.modelFactor),v=Number(t.value);if(!s||!Number.isFinite(v)||v<.1||v>10){toast('Enter a multiplier from 0.1 to 10.');render();return}s.factor=v;save();render();return}if(t.id==='schoolFilter'){filter=t.value;render()}else if(t.id==='schoolSort'){sort=t.value;render()}else if(t.id==='deadlineFilter'){deadlineFilter=t.value;render()}else if(t.id==='essayFilter'){essayFilter=t.value;render()}else if(t.id==='quickStatus'){sch(selected).status=t.value;save();render()}else if(d.check){const s=sch(selected);s.checks??={};s.checks[d.check]=t.checked;save()}else if(d.eventCheck){const ev=state.events.find(a=>a.id===d.eventCheck);if(ev){ev.done=t.checked;save();render()}}else if(d.essayStatus){const [,a]=findEssay(d.essayStatus);if(a){a.status=t.value;save()}}else if(t.id==='theme'){state.settings.theme=t.value;save();render()}else if(t.id==='logoSetting'){state.settings.logos=t.checked;save();render()}else if(t.id==='aidSetting'){state.settings.aid=t.checked;save()}else if(t.id==='optionalSetting'){state.settings.optional=t.checked;save()}else if(d.reminder!==undefined){const n=Number(d.reminder);state.settings.reminders=t.checked?[...new Set([...state.settings.reminders,n])].sort((a,b)=>b-a):state.settings.reminders.filter(x=>x!==n);save()}else if(t.id==='aiSchool'){aiSchool=t.value}else if(t.id==='aiMode'){aiMode=t.value}});
$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!valid(x))throw Error('Invalid backup format');if(confirm('Replace this browser’s workspace with the imported backup?')){state=migrateWorkspace(x);save();go('overview');toast('Backup imported')}}catch(err){toast('Import failed: '+err.message)}finally{e.target.value=''}});
window.addEventListener('storage',async e=>{if(e.key===KEY&&e.newValue){try{const x=await decrypt(e.newValue);if(valid(x)){state=migrateWorkspace(x);render()}}catch{}}});

render();initCloud();
